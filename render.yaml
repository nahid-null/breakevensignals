services:
  - type: worker
    name: crypto-signal-engine
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./engine-worker/Dockerfile
    autoDeployTrigger: 'off'
    envVars:
      - key: ENGINE_APP_URL
        sync: false
      - key: ENGINE_SHARED_SECRET
        sync: false